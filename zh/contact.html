<body>

<header class="site-header">
  <div class="wrap">
    <a href="index.html" class="brand">SEN <span class="mono">ENGINEERING</span></a>
    <nav class="primary"><a href="index.html">首页</a><a href="about.html">公司简介</a><a href="contact.html" aria-current="page">联系我们</a></nav>
    <div class="langswitch"><a href="../contact.html">KO</a><a href="../en/contact.html">EN</a><a href="../ja/contact.html">JA</a><a href="../zh/contact.html" aria-current="true">ZH</a></div>
  </div>
</header>

<section class="hero">
  <div class="wrap" style="grid-template-columns:1fr;">
    <div>
      <span class="eyebrow mono">TEST BUILD — 非正式站点</span>
      <h1>让我们一起<br>探讨您的项目。</h1>
      <p class="lead">技术资料索取、项目洽谈、报价咨询等，欢迎通过下方表单联系我们。（本页为测试页面，表单未连接实际发送功能。）</p>
    </div>
  </div>
</section>

<section class="block">
  <div class="wrap">
    <span class="section-num mono">01 — 联系我们</span>
    <h2>Contact Form</h2>

    <form class="contact-form" onsubmit="return false;">
      <div class="field">
        <label for="name">姓名 / 公司名称</label>
        <input id="name" name="name" type="text" placeholder="例：张三 / ○○建设">
      </div>
      <div class="field">
        <label for="email">电子邮箱</label>
        <input id="email" name="email" type="email" placeholder="you@example.com">
      </div>
      <div class="field">
        <label for="message">咨询内容</label>
        <textarea id="message" name="message" placeholder="请填写项目概要、审核需求等。"></textarea>
      </div>
      <button class="submit" type="submit">发送咨询（TEST）</button>
    </form>

    <div class="info-strip">
      <div><span class="mono">ADDRESS</span><strong>Seoul, Korea (TEST)</strong></div>
      <div><span class="mono">EMAIL</span><strong>info@senkuzo.com</strong></div>
      <div><span class="mono">CATEGORY</span><strong>Data Archive</strong></div>
    </div>
  </div>
</section>

<footer class="site-footer">
  <div class="wrap">
    <span>© SEN ENGINEERING GROUP — TEST BUILD</span>
    <span class="mono">zh/contact.html</span>
