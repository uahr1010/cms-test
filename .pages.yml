content:
  - name: ko
    label: 🇰🇷 한국어
    type: group
    items:
      - name: home_ko
        label: Home
        type: file
        path: index.html
        format: raw
        fields:
          - { name: body, label: HTML, type: code, options: { language: html } }
      - name: about_ko
        label: About
        type: file
        path: about.html
        format: raw
        fields:
          - { name: body, label: HTML, type: code, options: { language: html } }
      - name: contact_ko
        label: Contact
        type: file
        path: contact.html
        format: raw
        fields:
          - { name: body, label: HTML, type: code, options: { language: html } }
      - name: news_ko
        label: 뉴스
        type: file
        path: data/news.ko.json
        format: json
        list: true
        fields:
          - { name: title, label: 제목, type: string }
          - { name: date, label: 날짜, type: date }
          - { name: tag, label: 태그, type: select, options: { values: [PRESS, PROJECT, EVENT] } }
          - { name: lang, label: 언어, type: string }
          - { name: body, label: 내용, type: text }

