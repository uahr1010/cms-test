content:
  - name: home
    label: Home (index.html)
    type: file
    path: index.html
    format: raw
    fields:
      - name: body
        label: HTML
        type: code
        options:
          language: html
  - name: about
    label: About (about.html)
    type: file
    path: about.html
    format: raw
    fields:
      - name: body
        label: HTML
        type: code
        options:
          language: html
  - name: contact
    label: Contact (contact.html)
    type: file
    path: contact.html
    format: raw
    fields:
      - name: body
        label: HTML
        type: code
        options:
          language: html
  - name: news
    label: 뉴스/소식
    type: file
    path: data/news.json
    format: json
    list: true
    fields:
      - name: title
        label: 제목
        type: string
      - name: date
        label: 날짜
        type: date
      - name: tag
        label: 태그
        type: select
        options: [PRESS, PROJECT, EVENT]
      - name: body
        label: 내용
        type: text